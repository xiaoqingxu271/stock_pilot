[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-pilot"
version = "0.1.0"
description = "Inventory-driven e-commerce repricing and publishing agent over MCP"
readme = "CLAUDE.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
stock-pilot-mcp = "stock_pilot.mcp_server:main"
stock-pilot-api = "stock_pilot.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_pilot = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
